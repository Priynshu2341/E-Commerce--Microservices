server:
  port: 8060

spring:
  datasource:
    url: jdbc:postgresql://ms_pg_sql:5432/ecommerce?options=-c%20TimeZone=Asia/Kolkata
    username: venom
    password: venom
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Kolkata'
      connection-test-query: SELECT 1

  jackson:
    time-zone: Asia/Kolkata

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate.jdbc.time_zone: Asia/Kolkata


application:
  config:
    customer-url: http://customer-service:8090/api/v1/customers
    payment-url:  http://payment-service:8070/api/v1/payments
    stock-url:    http://stocks-service:8050/api/v1/stocks

management:
  tracing:
    sampling:
      probability: 1.0

zipkin:
  tracing:
    endpoint: http://zipkin:9411/api/v2/spans


eureka:
  client:
    service-url:
      defaultZone: http://eureka-discovery:8761/eureka